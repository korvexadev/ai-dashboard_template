name: mikozi-dashboard

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  target: runner

x-app-environment: &app-environment
  MIKOZI_API_URL: ${MIKOZI_API_URL:-http://host.docker.internal:9289/api/v1}

x-app-healthcheck: &app-healthcheck
  test:
    [
      "CMD",
      "node",
      "-e",
      "fetch('http://127.0.0.1:'+process.env.PORT+'/auth').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
    ]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 15s

services:
  app:
    profiles: [production]
    build: *app-build
    image: mikozi_dashboard_runtime
    container_name: mikozi_dashboard_app
    restart: unless-stopped
    environment:
      <<: *app-environment
      NODE_ENV: production
      PORT: 3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DASHBOARD_PORT:-3000}:3000"
    healthcheck: *app-healthcheck

  app-staging:
    profiles: [staging]
    build: *app-build
    image: mikozi_dashboard_runtime
    container_name: mikozi_dashboard_app_staging
    restart: unless-stopped
    environment:
      <<: *app-environment
      NODE_ENV: production
      PORT: 3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DASHBOARD_STAGING_PORT:-3001}:3001"
    healthcheck: *app-healthcheck

  app-development:
    profiles: [development]
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    image: mikozi_dashboard_app_development
    container_name: mikozi_dashboard_app_development
    restart: unless-stopped
    environment:
      <<: *app-environment
      NODE_ENV: development
      PORT: 3000
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DASHBOARD_DEVELOPMENT_PORT:-3000}:3000"
    volumes:
      - .:/app
      - mikozi_dashboard_node_modules:/app/node_modules
      - mikozi_dashboard_next:/app/.next
    healthcheck: *app-healthcheck

volumes:
  mikozi_dashboard_node_modules:
  mikozi_dashboard_next:
